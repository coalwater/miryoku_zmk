# Debug build: left half with USB CDC-ACM logging, to capture LS0XX / LVGL
# errors from the nice!view. Run manually, flash, then open the serial port.
# Not part of the normal push build.

name: 'Debug left half display logging'
on: workflow_dispatch
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["splitkb_aurora_corne_left nice_view_adapter nice_view"]'
      alphas: '["QWERTY"]'
      nav: '["vi"]'
      branches: '["zmkfirmware/zmk/v0.3-branch"]'
      kconfig: '["CONFIG_ZMK_USB_LOGGING=y\nCONFIG_LOG_BUFFER_SIZE=8192\nCONFIG_DISPLAY_LOG_LEVEL_DBG=y\nCONFIG_LVGL_LOG_LEVEL_DBG=y\nCONFIG_ZMK_LOG_LEVEL_DBG=y"]'
