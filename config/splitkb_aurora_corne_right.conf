CONFIG_I2C=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_KEYBOARD_NAME="Seshat R"
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_SPLIT=y
# Peripheral: the dongle is the central now.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Cirque trackpad. ZMK_POINTING is off by default (it only defaults on via the
# deprecated ZMK_MOUSE), and without it neither CONFIG_INPUT nor the input-split
# forwarding is compiled at all - the devicetree nodes alone do nothing.
CONFIG_ZMK_POINTING=y
