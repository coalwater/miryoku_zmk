# Dongle central: nice!nano v2 in a USB port, both halves are peripherals.

# Two split peripherals (left + right) instead of the default one.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Expose both halves' battery levels to the host.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# The dongle has no battery, but ZMK_BATTERY_REPORTING is what compiles
# src/events/battery_state_changed.c, which also defines the *peripheral*
# battery event the two configs above link against. Turning it off gives
# "undefined reference to zmk_event_zmk_peripheral_battery_state_changed".
# Its own reported level (nrf VDDH on USB) is meaningless; ignore it.
CONFIG_ZMK_BATTERY_REPORTING=y

# Always powered over USB: never deep sleep.
CONFIG_ZMK_SLEEP=n

# No display on the dongle.
CONFIG_ZMK_DISPLAY=n

# Receives the right half's Cirque events over the split link and runs the
# input listener against the keymap. Must match the right half's setting.
CONFIG_ZMK_POINTING=y

# Trackpad motion arrives as a continuous stream of split notifications (two per
# sample: REL_X, then REL_Y with sync), which is far more traffic than key
# events. The receive path is sized for keys only:
#   BT_CTLR_RX_BUFFERS=1 lets the controller take just ONE packet per connection
#   event - at a 7.5ms interval that caps the dongle at ~133 packets/sec for
#   BOTH halves combined, i.e. ~60 pointer samples/sec before keys take a share.
# The dongle runs on USB, so buffers here cost nothing we care about - unlike on
# a battery-powered half.
CONFIG_BT_CTLR_RX_BUFFERS=3
CONFIG_BT_BUF_ACL_RX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=10

# Report both halves' battery levels to the host. The BAS proxy above is BLE
# only (app/src/split/bluetooth/central_bas_proxy.c) and this dongle is on USB,
# so the levels also go out as a console line from modules/battery-log. Needs a
# build with the zmk-usb-logging snippet for the CDC ACM port to exist:
#   SNIPPET=zmk-usb-logging tools/local-build.sh splitkb_aurora_corne_dongle
CONFIG_ZMK_BATTERY_LOG=y
