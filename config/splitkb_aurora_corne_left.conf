CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_DISPLAY=y

# nice!view: keep the shield's own status screen (peripheral variant draws the
# art, this half's battery, and the link-to-central bolt). Do NOT force
# ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN here: that screen is written for OLEDs,
# selects a 26px font, and turning CUSTOM off also drops the shield's
# LV_Z_MEM_POOL_SIZE=4096 default.

# The aurora shield and the nice_view shield both set LVGL defaults for these
# symbols. Shields are processed in SHIELD order, aurora comes first, and the
# first Kconfig `default` wins - so nice_view's values (100 / 161) lose to
# aurora's (64 / 148). A 64% viewport buffer makes LVGL flush partial chunks,
# which the sharp-memory LS0XX driver cannot render (it writes whole lines).
# Values set in this file override both defaults.
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_DPI_DEF=161
CONFIG_LV_Z_FULL_REFRESH=y

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_KEYBOARD_NAME="Seshat L"
CONFIG_ZMK_SPLIT=y
# Peripheral: the dongle is the central now.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
