CONFIG_ZMK_BATTERY_REPORTING=y

# No display on this half: the nice!view is physically removed, and building
# it in was the left half's battery drain. The nice_view_adapter maps its SPI
# SCK/MOSI onto the OLED header's SCL/SDA pads (P0.20/P0.17), and pinctrl
# drives both as outputs held low between transfers (zephyr
# drivers/pinctrl/pinctrl_nrf.c, NRF_FUN_SPIM_SCK/MOSI: write = 0). The Aurora
# puts the 4k7 I2C pull-ups R1/R2 from switched VCC onto those same pads, so
# every second the half is awake ~2 x 3.3V/4k7 = 1.4 mA flowed into the pins.
# The drain stopped only at deep sleep, when ext-power cuts VCC. Do not add
# the nice_view shields back without removing R1/R2 from this half.
CONFIG_ZMK_DISPLAY=n

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_KEYBOARD_NAME="Seshat L"
CONFIG_ZMK_SPLIT=y
# Peripheral: the dongle is the central now.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
